name: heartbeat
on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: beat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_BEAT.txt
          echo "workflow scope test OK" >> LAST_BEAT.txt
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_BEAT.txt
          git commit -m "heartbeat $(date -u +%F)" || echo "nothing to commit"
          git push
